name: Temporary GHCR Image

on:
  push:
    branches:
      - 3.3-dev-limil

permissions:
  contents: read
  packages: write

concurrency:
  group: temporary-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lxfee/auto_bangumi
  IMAGE_TAG: 3.3.5-limil.1

jobs:
  build-webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Build webui
        working-directory: webui
        run: pnpm build

      - name: Upload webui
        uses: actions/upload-artifact@v4
        with:
          name: temporary-ghcr-dist
          path: webui/dist
          retention-days: 1

  build-image:
    runs-on: ubuntu-latest
    needs: build-webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create version info
        working-directory: backend/src
        run: echo "VERSION='${{ env.IMAGE_TAG }}'" > module/__version__.py

      - name: Download webui
        uses: actions/download-artifact@v4
        with:
          name: temporary-ghcr-dist
          path: backend/src/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=temporary-ghcr
          cache-to: type=gha,scope=temporary-ghcr,mode=max,ignore-error=true
